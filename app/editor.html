<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GamCECOS · Casos</title>
<link rel="stylesheet" href="estil.css">
</head>
<body>
<main class="editor">
  <header class="capcalera">
    <span class="marca">GamCECOS · Gestió de casos</span>
    <a href="/tutor" class="boto secundari">Tornar al tutor</a>
    <div class="info"><span id="estat-desat" class="suau"></span></div>
  </header>
  <aside class="panell">
    <div class="accions">
      <button class="boto" id="nou">+ Cas nou</button>
      <label class="boto secundari importa">Importar JSON<input type="file" id="importa" accept=".json,application/json" hidden></label>
    </div>
    <input id="cerca" class="cerca" placeholder="Cerca per títol o text">
    <select id="filtre-tematica" class="cerca"><option value="">Totes les temàtiques</option></select>
    <div id="llista" class="llista-casos"></div>
  </aside>
  <section class="panell" id="formulari"><p class="suau">Trieu un cas o creeu-ne un de nou.</p></section>
</main>
<script type="module" src="editor.mjs"></script>
</body>
</html>
