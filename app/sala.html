<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GamCECOS · Sala</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="estil.css">
<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/qrcodejs/qrcode.min.js"></script>
</head>
<body>
<form id="entrada" class="formulari panell">
  <h1>GamCECOS · Sala de l'equip</h1>
  <label>Codi de la guàrdia (el dona el tutor) <input name="sala" maxlength="4" required autocapitalize="characters" style="text-transform:uppercase"></label>
  <button class="boto">Entrar a la sala</button>
  <p class="suau" id="error-entrada"></p>
</form>

<div id="joc" class="sala" hidden>
  <header class="capcalera">
    <span class="marca">GamCECOS</span>
    <span id="cecos" class="suau"></span>
    <span class="rellotge" id="rellotge">--:--</span>
    <span id="pausa" class="etiqueta v-perillosa" hidden>PAUSA</span>
    <div class="info">
      <span id="disponibles"></span>
      <b id="puntuacio"></b>
      <div class="qr"><div id="qr"></div><span>Vota a<br><b id="url-vot"></b></span></div>
    </div>
  </header>
  <section class="columna">
    <div class="panell">
      <h3>Llistat d'incidents <span class="suau" id="comptador"></span></h3>
      <div id="cua" class="cua"><p class="suau">Esperant que el tutor iniciï la guàrdia...</p></div>
    </div>
    <div class="panell registre">
      <div class="pestanyes"><span class="activa">Registre</span></div>
      <div id="registre"></div>
    </div>
  </section>
  <section class="columna">
    <div class="panell" id="incident"></div>
    <div class="panell" id="pas"></div>
  </section>
  <section class="columna">
    <div class="panell mapa-panell"><div id="mapa"></div></div>
    <div class="panell" id="gestor"></div>
  </section>
</div>
<script type="module" src="sala.mjs"></script>
</body>
</html>
